spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:mock-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:mock-google-client-secret}
            redirect-uri: "${BACKEND_URL:https://startup-kit-be.onrender.com}/login/oauth2/code/google"
            scope:
              - email
              - profile
          linkedin:
            client-id: ${LINKEDIN_CLIENT_ID:linkedin-client-id}
            client-secret: ${LINKEDIN_CLIENT_SECRET:linkedin-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${BACKEND_URL:http://localhost:8080}/login/oauth2/code/linkedin"
            scope:
              - openid
              - profile
              - email
            client-name: LinkedIn
        provider:
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            user-info-uri: https://api.linkedin.com/v2/userinfo
            user-name-attribute: sub

  application:
    name: platform

  jackson:
    time-zone: Asia/Ho_Chi_Minh

  datasource:
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:startupkit_db}}
    username: ${DB_USERNAME:startupkit_user}
    password: ${DB_PASSWORD:startupkit_pass}
    hikari:
      initialization-fail-timeout: ${HIKARI_INIT_TIMEOUT:10000}
      connection-timeout: 20000
      maximum-pool-size: 5

  jpa:
    database-platform: ${DB_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    flyway:
      enabled: ${FLYWAY_ENABLED:true}
      locations: classpath:database/migration
      baseline-on-migrate: true
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:no-reply@startupkit.vn}
    password: ${MAIL_PASSWORD:mock-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

jwt:
  signerKey: ${JWT_SIGNER_KEY:startupkit-default-jwt-secret-key-at-least-32-bytes-long-2026-production}
  valid-duration: ${JWT_VALID_DURATION:3600}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION:86400}

app:
  oauth2-redirect-uri: ${FRONTEND_URL:https://startupkit.com.vn}/vi/oauth2/callback
