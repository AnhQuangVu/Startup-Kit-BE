version: '3.8'

services:
  postgres:
    image: postgres:14.22
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: startupkit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: