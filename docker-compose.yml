version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Dang04072004
      MYSQL_DATABASE: startupkit
      MYSQL_USER: dang
      MYSQL_PASSWORD: Dang04072004
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  web:
    build: .
    container_name: fastapi_app
    restart: always
    env_file:
      - .env
    ports:
      - "8003:8003"
    depends_on:
      - db
    networks:
      - backend

volumes:
  mysql_data:

networks:
  backend:
