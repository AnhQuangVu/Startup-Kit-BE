name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - render-deploy
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Spring Boot 4 / Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: startupkit_db
          POSTGRES_USER: startupkit_user
          POSTGRES_PASSWORD: startupkit_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: ⚙️ Verify Maven & Dependencies
        run: ./mvnw -v

      - name: 🔨 Compile Application
        run: ./mvnw clean compile -B

      - name: 🧪 Run Unit & Context Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/startupkit_db
          SPRING_DATASOURCE_USERNAME: startupkit_user
          SPRING_DATASOURCE_PASSWORD: startupkit_pass
        run: ./mvnw test -B

      - name: 📦 Package Executable JAR
        run: ./mvnw package -DskipTests -B

      - name: 🐳 Verify Docker Build
        run: docker build -t startupkit-be:latest .

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: startupkit-be-jar
          path: target/platform-0.0.1-SNAPSHOT.jar
          retention-days: 7

  deploy:
    name: Continuous Deployment
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/render-deploy'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Trigger Render Deploy (if webhook configured)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render zero-downtime deployment..."
          curl -sS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy hook triggered successfully!"

      - name: 🖥️ Deploy to VPS via SSH (if VPS secrets configured)
        if: env.VPS_HOST != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Deploying StartupKit Backend to server..."
            if [ -d "/root/app/be" ]; then
              cd /root/app/be
              git pull origin main
              docker compose up -d --build
              docker image prune -f
            fi
